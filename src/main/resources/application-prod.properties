# Perfil de producción: todo se inyecta por variables de entorno.
spring.datasource.url=${POSTGRES_URL}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200,https://sistema-salud-fisica.vercel.app}

# RFC-05: evitar que cada consulta SQL se imprima en los logs de producción
spring.jpa.show-sql=false
